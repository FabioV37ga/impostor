<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#ff0000">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <title>Impostor - Engane seus amigos!</title>
    <link rel="stylesheet" href="styles/document.css">
    <link rel="stylesheet" href="styles/loading.css">
    <link rel="stylesheet" href="styles/auth.css">
    <link rel="stylesheet" href="styles/home.css">
    <link rel="stylesheet" href="styles/createRoom.css">
    <link rel="stylesheet" href="styles/joinRoom.css">
    <link rel="stylesheet" href="styles/lobby.css">
    <!-- <link rel="stylesheet" href="styles/home.css"> -->
</head>

<body>
    <main>
        <section class="loading-screen">
            <div class="loading-content">
                <i class="fa fa-spinner" aria-hidden="true"></i>
                <p class="loading-text">Conectando ao servidor...</p>
                <small>Isso pode demorar alguns minutos.</small>
            </div>
        </section>
        <section class="logo">
            <div class="logo-container">
                <img src="./logo.png" alt="">
            </div>
        </section>
        <section class="content">
            <section class="lobby">
                <div class="lobby-title">
                    <span class="horizontal-bar"></span>
                    <p class="lobby-title-p">
                        Sala: <span id="lobby-title-inviteCode">aj2o3p</span>
                    </p>
                    <span class="horizontal-bar"></span>
                </div>
                <div class="lobby-waiting">
                    Aguardando jogadores...
                </div>
                <ul class="lobby-playerList">
                    <li class="lobby-player">
                        <img src="./charMale.png" alt="">
                        <p class="player-nickname">
                            Fulano
                        </p>
                        <div class="player-hostMark">
                            host
                        </div>
                    </li>
                </ul>
                <p class="wait-playerCount">
                    Esperando 1/6 jogadores...
                </p>
                <button id="host-startGame">
                    Iniciar partida
                </button>
            </section>
        </section>
    </main>
</body>
<script type="module" src="app.ts"></script>

</html>
