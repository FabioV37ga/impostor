<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <title>Impostor - Engane seus amigos!</title>
    <link rel="stylesheet" href="styles/document.css">
    <link rel="stylesheet" href="styles/loading.css">
    <link rel="stylesheet" href="styles/home.css">
</head>
<body>
    <main>
        <section class="loading-screen">
            <div class="loading-content">
                <i class="fa fa-spinner" aria-hidden="true"></i>
                <p class="loading-text">Conectando ao servidor...</p>
                <small>Isso pode demorar alguns minutos.</small>
            </div>
        </section>
        <section class="logo">
            <div class="logo-container">
                <img src="./logo.png" alt="">
            </div>
        </section>
        <section class="button-area">
            <div class="button-area-text">
                <span class="horizontal-bar"></span>
                <p>multiplayer</p>
                <span class="horizontal-bar"></span>
            </div>
            <div class="buttons">
                <button id="join-lobby-btn">Entrar em sala</button>
                <button id="create-lobby-btn">criar uma sala</button>
            </div>
        </section>
        <section class="tutorial">
            <!-- como jogar -->
        </section>
    </main>
</body>
<script type="module" src="app.ts"></script>
</html>
